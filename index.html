<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Торговая игра</title>
  <style>
    :root {
      --accent: #3b82f6;
      --panel-bg: #1f2937;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; }
    .hidden { display: none !important; }
    .msg-error { color: var(--danger); }
    .msg-success { color: var(--success); }
    
    /* Экран авторизации */
    #auth-screen { background: #1e293b; padding: 30px; border-radius: 12px; margin-bottom: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    button { padding: 10px 20px; border-radius: 6px; cursor: pointer; background: var(--accent); color: white; border: none; }
    button:hover { opacity: 0.9; }

    /* Игровой интерфейс */
    #game-header { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .game-layout { background: #1e293b; padding: 20px; border-radius: 12px; }
    #market-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .item-card { border: 1px solid #334155; padding: 15px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
    .item-card:hover { transform: translateY(-3px); }
    .item-card.selected { border-color: var(--accent); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
    .item-info h3 { margin: 0 0 8px 0; }
    .item-price { color: #94a3b8; font-size: 0.9em; }
    .item-stats { margin-top: 8px; font-size: 0.85em; color: #64748b; }

    #chart-area { position: relative; width: 100%; height: 240px; background: #0f172a; border-radius: 8px; margin-top: 20px; overflow: hidden; }
    .data-point { z-index: 10; }
    .tooltip { pointer-events: none; color: white; white-space: nowrap; }

    .actions-panel { margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; }
    .actions-panel input { width: 140px; }

    /* Админ-панель */
    #admin-panel { background: #334155; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; }
    #admin-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Торговая площадка</h1>

    <!-- Экран авторизации -->
    <div id="auth-screen">
      <div class="auth-form">
        <input type="text" id="login-input" placeholder="Ник" />
        <input type="password" id="password-input" placeholder="Пароль" />
        <div style="display: flex; gap: 10px;">
          <button id="btn-login">Войти</button>
          <button id="btn-register">Регистрация</button>
        </div>
        <p id="auth-msg"></p>
      </div>
    </div>

    <!-- Игровой интерфейс -->
    <div id="game-header" class="hidden">
      <div>
        <span>Игрок: <strong id="current-user-display"></strong></span>
        <span style="margin-left: 20px;">Баланс: <span id="balance-val">0 ₽</span></span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="btn-save">Сохранить</button>
        <button id="btn-load">Загрузить</button>
        <button id="btn-logout">Выход</button>
      </div>
    </div>

    <div class="game-layout hidden">
      <div>
        <h3>Выбран предмет: <span id="selected-item-name"></span></h3>
        <p>Текущая рыночная цена продажи: <span id="current-market-price">0 ₽</span></p>
      </div>

      <div id="chart-area"></div>

      <div id="market-list"></div>

      <div class="actions-panel">
        <button id="btn-buy">Купить</button>
        <button id="btn-sell">Продать</button>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="number" id="custom-price" placeholder="Цена ставки" step="1" />
          <button id="btn-offer">Ставка</button>
        </div>
      </div>

      <p id="status-msg" style="margin-top: 15px;"></p>

      <!-- Админ-панель -->
      <button id="btn-admin-toggle" style="margin-top: 20px;">🔒 Панель админа</button>
      <div id="admin-panel">
        <h4>Админ-панель</h4>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="text" id="admin-target-nick" placeholder="Ник игрока" />
          <input type="number" id="admin-amount" placeholder="Сумма" />
          <button id="admin-send">Выдать деньги</button>
        </div>
        <p id="admin-status"></p>
      </div>
    </div>
  </div>

  <script>
    const authScreen = document.getElementById('auth-screen');
    const gameHeader = document.getElementById('game-header');
    const gameLayout = document.querySelector('.game-layout');
    const loginInput = document.getElementById('login-input');
    const passwordInput = document.getElementById('password-input');
    const btnLogin = document.getElementById('btn-login');
    const btnRegister = document.getElementById('btn-register');
    const authMsg = document.getElementById('auth-msg');
    const currentUserDisplay = document.getElementById('current-user-display');
    const balanceVal = document.getElementById('balance-val');
    const marketList = document.getElementById('market-list');
    const selectedItemName = document.getElementById('selected-item-name');
    const currentMarketPrice = document.getElementById('current-market-price');
    const statusMsg = document.getElementById('status-msg');

    const adminPanel = document.getElementById('admin-panel');
    const btnAdminToggle = document.getElementById('btn-admin-toggle');
    const adminTargetNick = document.getElementById('admin-target-nick');
    const adminAmount = document.getElementById('admin-amount');
    const adminSend = document.getElementById('admin-send');
    const adminStatus = document.getElementById('admin-status');

    let currentUser = null;
    let balance = 1000;
    let itemsData = [];
    let selectedItemId = null;

    const defaultItems = [
      { id: 'gum', name: 'Жвачка', baseBuy: 25, baseSell: 35, stock: 500, owned: 0, volatility: 0.05 },
      { id: 'coffee', name: 'Стакан кофе', baseBuy: 180, baseSell: 260, stock: 200, owned: 0, volatility: 0.08 },
      { id: 'phone_old', name: 'Старый смартфон', baseBuy: 4500, baseSell: 5800, stock: 80, owned: 0, volatility: 0.12 },
      { id: 'laptop_used', name: 'Б/у ноутбук', baseBuy: 22000, baseSell: 29000, stock: 30, owned: 0, volatility: 0.10 },
      { id: 'headphones', name: 'Беспроводные наушники', baseBuy: 3200, baseSell: 4300, stock: 120, owned: 0, volatility: 0.11 },
      { id: 'watch_casual', name: 'Наручные часы (простые)', baseBuy: 1500, baseSell: 2300, stock: 90, owned: 0, volatility: 0.13 },
      { id: 'tablet_mid', name: 'Планшет средней модели', baseBuy: 11000, baseSell: 14500, stock: 40, owned: 0, volatility: 0.09 },
      { id: 'powerbank', name: 'Powerbank 20000 mAh', baseBuy: 1300, baseSell: 1900, stock: 150, owned: 0, volatility: 0.07 },
      { id: 'keyboard_mech', name: 'Механическая клавиатура', baseBuy: 4800, baseSell: 6500, stock: 60, owned: 0, volatility: 0.10 },
      { id: 'mouse_gaming', name: 'Игровая мышь', baseBuy: 2100, baseSell: 3100, stock: 100, owned: 0, volatility: 0.12 },
      { id: 'backpack_urban', name: 'Городской рюкзак', baseBuy: 2700, baseSell: 3800, stock: 70, owned: 0, volatility: 0.08 },
      { id: 'sunglasses', name: 'Солнцезащитные очки', baseBuy: 900, baseSell: 1400, stock: 180, owned: 0, volatility: 0.14 },
      { id: 'tshirt_brand', name: 'Футболка брендовая', baseBuy: 1600, baseSell: 2400, stock: 250, owned: 0, volatility: 0.06 },
      { id: 'jeans_premium', name: 'Джинсы премиум', baseBuy: 4200, baseSell: 5900, stock: 50, owned: 0, volatility: 0.09 },
      { id: 'camera_compact', name: 'Компактная камера', baseBuy: 8500, baseSell: 11500, stock: 35, owned: 0, volatility: 0.11 },
      { id: 'drone_mini', name: 'Мини‑дрон', baseBuy: 7200, baseSell: 9800, stock: 45, owned: 0, volatility: 0.13 }
    ];

    function getUsers() {
      try {
        const stored = localStorage.getItem('scupshik_users');
        if (!stored) return {};
        return JSON.parse(stored);
      } catch (e) {
        console.error('Ошибка localStorage:', e);
        showAuthMessage('Ошибка хранилища браузера.', true);
        return {};
      }
    }

    function saveUsers(users) {
      try {
        localStorage.setItem('scupshik_users', JSON.stringify(users));
        return true;
      } catch (e) {
        console.error('Не удалось сохранить:', e);
        showAuthMessage('Не удалось сохранить данные.', true);
        return false;
      }
    }

    function showAuthMessage(text, isError) {
      authMsg.textContent = text;
      authMsg.className = isError ? 'msg-error' : 'msg-success';
    }

    btnRegister.addEventListener('click', () => {
      const nick = loginInput.value.trim();
      const pass = passwordInput.value.trim();

      if (!nick || !pass) {
        showAuthMessage('Ник и пароль обязательны', true);
        return;
      }

      const users = getUsers();
      if (users[nick]) {
        showAuthMessage('Такой ник уже занят', true);
        return;
      }

      const userItems = defaultItems.map(item => ({ ...item }));
      users[nick] = { password: pass, balance: 1000, items: userItems };

      if (!saveUsers(users)) return;
      showAuthMessage('Аккаунт создан! Теперь войдите', false);
    });

    btnLogin.addEventListener('click', () => {
      const nick = loginInput.value.trim();
      const pass = passwordInput.value.trim();

      if (!nick || !pass) {
        showAuthMessage('Введите ник и пароль', true);
        return;
      }

      const users = getUsers();
      const user = users[nick];

      if (!user || user.password !== pass) {
        showAuthMessage('Неверный ник или пароль', true);
        return;
      }

      currentUser = nick;
      balance = user.balance;
      itemsData = user.items;
      switchToGame();
    });

    function switchToGame() {
      authScreen.classList.add('hidden');
      gameHeader.classList.remove('hidden');
      gameLayout.classList.remove('hidden');
      currentUserDisplay.textContent = currentUser;
      renderMarket();
      loadGameData();
    }

    function loadGameData() {
      const users = getUsers();
      const userData = users[currentUser];
      if (!userData) {
        alert('Данные пользователя не найдены — выход в меню.');
        logout();
        return;
      }
      balance = userData.balance;
      itemsData = userData.items;
      balanceVal.textContent = balance.toLocaleString() + ' ₽';
    }

    function saveGameData() {
      const users = getUsers();
      if (!users[currentUser]) {
        statusMsg.textContent = 'Ошибка: пользователь не найден';
        statusMsg.style.color = '#ef4444';
        return;
      }
      users[currentUser].balance = balance;
      users[currentUser].items = itemsData;
      if (saveUsers(users)) {
        statusMsg.textContent = 'Прогресс сохранён!';
        statusMsg.style.color = '#10b981';
        setTimeout(() => statusMsg.textContent = '', 2000);
      }
    }

    document.getElementById('btn-save').addEventListener('click', saveGameData);

    document.getElementById('btn-load').addEventListener('click', () => {
      loadGameData();
      balanceVal.textContent = balance.toLocaleString() + ' ₽';
      renderMarket();
      statusMsg.textContent = 'Данные загружены!';
      statusMsg.style.color = '#10b981';
      setTimeout(() => statusMsg.textContent = '', 2000);
    });

    function logout() {
      currentUser = null;
      authScreen.classList.remove('hidden');
      gameHeader.classList.add('hidden');
      gameLayout.classList.add('hidden');
      loginInput.value = '';
      passwordInput.value = '';
    }

    document.getElementById('btn-logout').addEventListener('click', logout);

    btnAdminToggle.addEventListener('click', () => adminPanel.classList.toggle('active'));

    const ADMIN_PASSWORD = '*2923145687al';

    adminSend.addEventListener('click', () => {
            const inputPass = prompt('Введите админ‑пароль:');
      if (inputPass !== ADMIN_PASSWORD) {
        adminStatus.textContent = 'Неверный пароль!';
        adminStatus.style.color = 'var(--danger)';
        return;
      }

      const targetNick = adminTargetNick.value.trim();
      const amount = parseInt(adminAmount.value, 10);

      if (!targetNick || isNaN(amount) || amount <= 0) {
        adminStatus.textContent = 'Проверьте ник и сумму!';
        adminStatus.style.color = 'var(--danger)';
        return;
      }

      const users = getUsers();
      if (!users[targetNick]) {
        adminStatus.textContent = 'Игрок не найден!';
        adminStatus.style.color = 'var(--danger)';
        return;
      }

      users[targetNick].balance += amount;
      saveUsers(users);

      adminStatus.textContent = `Выдано ${amount.toLocaleString()} ₽ игроку ${targetNick}`;
      adminStatus.style.color = 'var(--success)';
      setTimeout(() => adminStatus.textContent = '', 3000);
    });

    function renderMarket() {
      marketList.innerHTML = '';
      itemsData.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${selectedItemId === item.id ? 'selected' : ''}`;
        card.onclick = () => selectItem(item.id);
        card.innerHTML = `
          <div class="item-info">
            <h3>${item.name}</h3>
            <span class="item-price">Покупка: ${item.baseBuy.toLocaleString()} ₽ / Продажа: ${item.baseSell.toLocaleString()} ₽</span>
            <div class="item-stats">
              На рынке: ${item.stock} шт. • У вас: ${item.owned} шт.
            </div>
          </div>
        `;
        marketList.appendChild(card);
      });
    }

    function selectItem(id) {
      selectedItemId = id;
      const item = itemsData.find(i => i.id === id);
      selectedItemName.textContent = item.name;
      currentMarketPrice.textContent = `${item.baseSell.toLocaleString()} ₽`;
      renderChart(item);
      renderMarket();
    }

    function renderChart(item) {
      const container = document.getElementById('chart-area');
      container.innerHTML = '';

      const points = [];
      let currentPrice = item.baseSell;

      for (let i = 0; i < 20; i++) {
        const change = (Math.random() - 0.5) * 2 * item.volatility * currentPrice;
        currentPrice += change;

        const minLimit = item.baseBuy * 0.7;
        const maxLimit = item.baseSell * 1.3;
        if (currentPrice < minLimit) currentPrice = minLimit;
        if (currentPrice > maxLimit) currentPrice = maxLimit;

        points.push(currentPrice);
      }

      const width = container.clientWidth || 600;
      const height = 240;
      const padding = 40;
      const xStep = (width - padding * 2) / 19;
      const maxPrice = Math.max(...points);
      const minPrice = Math.min(...points);
      const range = maxPrice - minPrice || 1;

      points.forEach((price, i) => {
        const x = padding + i * xStep;
        const y = height - padding - ((price - minPrice) / range) * (height - padding * 2);

        const dot = document.createElement('div');
        dot.className = 'data-point';
        dot.style.position = 'absolute';
        dot.style.left = x + 'px';
        dot.style.top = y + 'px';
        dot.style.width = '6px';
        dot.style.height = '6px';
        dot.style.background = 'var(--accent, #3b82f6)';
        dot.style.borderRadius = '50%';

        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        tooltip.style.position = 'absolute';
        tooltip.style.bottom = '12px';
        tooltip.style.left = '-10px';
        tooltip.style.padding = '4px 8px';
        tooltip.style.backgroundColor = 'var(--panel-bg, #1f2937)';
        tooltip.style.border = '1px solid var(--border, #334155)';
        tooltip.style.borderRadius = '4px';
        tooltip.style.fontSize = '0.75rem';
        tooltip.textContent = price.toLocaleString() + ' ₽';
        
        dot.appendChild(tooltip);
        container.appendChild(dot);
      });
    }

    function performAction(action) {
      if (!selectedItemId) {
        statusMsg.textContent = 'Сначала выберите предмет!';
        statusMsg.style.color = '#ef4444';
        return;
      }

      const item = itemsData.find(i => i.id === selectedItemId);
      const price = action === 'buy' ? item.baseBuy : item.baseSell;

      if (action === 'buy') {
        if (balance < price) {
          statusMsg.textContent = 'Недостаточно средств!';
          statusMsg.style.color = '#ef4444';
          return;
        }
        if (item.stock <= 0) {
          statusMsg.textContent = 'Товара нет на рынке!';
          statusMsg.style.color = '#ef4444';
          return;
        }
        balance -= price;
        item.stock--;
        item.owned++;
      } else if (action === 'sell') {
        if (item.owned <= 0) {
          statusMsg.textContent = 'У вас нет такого товара!';
          statusMsg.style.color = '#ef4444';
          return;
        }
        balance += price;
        item.stock++;
        item.owned--;
      }

      balanceVal.textContent = balance.toLocaleString() + ' ₽';
      renderMarket();
      statusMsg.textContent = action === 'buy' ? 'Куплено!' : 'Продано!';
      statusMsg.style.color = '#10b981';
    }

    function setCustomOffer() {
      const input = document.getElementById('custom-price');
      const offer = parseFloat(input.value);
      if (!offer || offer <= 0) {
        statusMsg.textContent = 'Введите корректную цену!';
        statusMsg.style.color = '#ef4444';
        return;
      }
      statusMsg.textContent = `Ставка выставлена: ${offer.toLocaleString()} ₽ (пока без сделки)`;
      statusMsg.style.color = '#3b82f6';
      input.value = '';
    }

    document.getElementById('btn-buy').addEventListener('click', () => performAction('buy'));
    document.getElementById('btn-sell').addEventListener('click', () => performAction('sell'));
    document.getElementById('btn-offer').addEventListener('click', setCustomOffer);
  </script>
</body>
</html>
