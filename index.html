<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скупщик</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; background: #1e1e1e; color: white; min-height: 100vh; padding-bottom: 100px; user-select: none; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #2b2b2b; position: sticky; top: 0; z-index: 50; }
.btn-round { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 20px; color: #1e1e1e; }
.balance { background: white; color: #1e1e1e; padding: 8px 15px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
.balance-plus { color: #00c853; font-size: 22px; font-weight: bold; }
.tabs { display: flex; gap: 10px; padding: 15px; }
.tab { padding: 12px 20px; border-radius: 25px; background: #2b2b2b; color: #888; font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: background 0.2s; }
.tab.active { background: #ff8c1a; color: white; }
.content { padding: 0 15px; }
.empty { color: #666; padding: 40px 0; font-size: 16px; }
.bottombar { position: fixed; bottom: 0; left: 0; right: 0; background: #2b2b2b; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 50; }
.bottom-btn { background: none; border: none; color: #888; font-size: 26px; cursor: pointer; padding: 5px 15px; }
.bottom-btn.active { color: #00aaff; }
.chest-btn { background: #ff8c1a; color: #666; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -25px; box-shadow: 0 4px 10px rgba(255,140,26,0.5); transition: transform 0.2s; padding: 0; }
.chest-btn:hover { transform: scale(1.1); }
.chest-btn:active { transform: scale(0.95); }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
.modal.open { display: flex; }
.modal-content { background: #2b2b2b; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; text-align: center; }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #3a3a3a; }
.setting-label { font-size: 16px; }
.theme-toggle { display: flex; background: #1e1e1e; border-radius: 20px; padding: 3px; }
.theme-btn { padding: 8px 16px; border: none; background: none; color: #888; border-radius: 17px; cursor: pointer; font-weight: bold; }
.theme-btn.active { background: #00aaff; color: white; }
input[type=range] { -webkit-appearance: none; width: 140px; height: 6px; background: #1e1e1e; border-radius: 3px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #00aaff; border-radius: 50%; cursor: pointer; }
.price-display { background: white; color: #1e1e1e; font-size: 28px; font-weight: bold; text-align: center; padding: 18px; border-radius: 50px; margin: 15px 0; }
.slider-wrap { position: relative; margin: 25px 0; }
.slider-labels { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
.slider-labels .green { color: #00c853; }
.slider-labels .red { color: #ff1744; }
.slider-track { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(to right, #00c853 0%, #00c853 20%, #00aaff 30%, #00aaff 70%, #ff1744 80%, #ff1744 100%); }
.slider-input { -webkit-appearance: none; width: 100%; height: 8px; background: transparent; position: absolute; top: 0; margin: 0; pointer-events: none; }
.slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: white; border: 3px solid #ff1744; border-radius: 50%; cursor: pointer; pointer-events: auto; margin-top: -8px; }
.price-caption { text-align: center; font-size: 18px; font-weight: bold; margin-top: 15px; }
.price-caption.down { color: #00c853; }
.price-caption.up { color: #ff1744; }
.price-caption.normal { color: #00aaff; }
.big-btn { width: 100%; padding: 18px; background: #00aaff; color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
.big-btn:hover { background: #0091ea; }

.inv-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.inv-tab { flex: 1; padding: 14px; border-radius: 25px; background: #2b2b2b; color: #888; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
.inv-tab.active { background: #00aaff; color: white; }

.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inv-card {
    background: white;
    border-radius: 18px;
    padding: 12px;
    position: relative;
    box-shadow: 0 0 12px rgba(255,140,26,0.6);
    border: 2px solid #ff8c1a;
}
.inv-card .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #00c853;
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
}
.inv-card img {
    width: 100%;
    height: 100px;
    object-fit: contain;
    margin-bottom: 8px;
}
.inv-card .inv-name {
    color: #1e1e1e;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 10px;
}
.inv-card .btn-sell {
    width: 100%;
    background: #00aaff;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 6px;
}
.inv-card .btn-fast {
    width: 100%;
    background: #ff1744;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}
.empty-inv { color: #666; padding: 40px 0; text-align: center; grid-column: 1 / -1; }

.collection-header { display: flex; justify-content: space-between; align-items: center; padding: 5px 0 15px; }
.collection-header h2 { font-size: 22px; font-weight: bold; }
.collection-header .progress { color: #ff8c1a; font-size: 22px; font-weight: bold; }

.collection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.collection-card { background: #3a3a3a; border-radius: 15px; overflow: hidden; position: relative; cursor: pointer; }
.collection-card .rarity { position: absolute; top: 10px; left: 10px; background: #888; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 2; }
.collection-card .img-wrap { background: #2b2b2b; height: 120px; display: flex; align-items: center; justify-content: center; position: relative; }
.collection-card .img-wrap img { max-width: 70%; max-height: 70%; object-fit: contain; filter: brightness(0.4); }
.collection-card .not-collected { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 13px; text-align: center; z-index: 2; }
.collection-card .bottom { background: #b0b0b0; color: #1e1e1e; padding: 12px; font-weight: bold; font-size: 14px; }
.collection-card.collected .img-wrap img { filter: none; }
.collection-card.collected .bottom { background: #ff8c1a; color: white; }
.collection-card.collected .not-collected { display: none; }
.collection-card.collected .rarity { background: #00aaff; }

body.light { background: #f0f0f0; color: #1e1e1e; }
body.light .topbar, body.light .bottombar { background: #ffffff; }
body.light .btn-round { background: #1e1e1e; color: white; }
body.light .balance { background: #1e1e1e; color: white; }
body.light .tab { background: #e0e0e0; color: #666; }
body.light .modal-content { background: #ffffff; color: #1e1e1e; }
body.light .setting-row { border-bottom-color: #e0e0e0; }
body.light .theme-toggle { background: #e0e0e0; }
body.light .inv-tab { background: #e0e0e0; color: #666; }
</style>
</head>
<body>

<div class="topbar">
    <button class="btn-round" onclick="openModal('settingsModal')">⚙️</button>
    <div class="balance"><span class="balance-plus">+</span> <span id="balanceValue">0</span> ₽</div>
</div>

<div class="tabs">
    <button class="tab active" onclick="switchTab('market', this)">МАРКЕТ</button>
    <button class="tab" onclick="switchTab('my-sales', this)">МОИ ПРОДАЖИ</button>
</div>

<div class="content">
    <div id="marketContent" class="empty">Тут будут предметы из маркета.</div>
    <div id="mySalesContent" class="empty" style="display:none;">У вас пока нет продаж.</div>
</div>

<div class="bottombar">
    <button class="bottom-btn" onclick="openInventory()">💼</button>
    <button class="bottom-btn chest-btn" onclick="openChest()">🎁</button>
    <button class="bottom-btn" onclick="openIndex()">⚡</button>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">⚙️ Настройки</div>
        <div class="setting-row">
            <div class="setting-label">Тема</div>
            <div class="theme-toggle">
                <button class="theme-btn active" id="themeLight" onclick="setTheme('light')">Светлая</button>
                <button class="theme-btn" id="themeDark" onclick="setTheme('dark')">Тёмная</button>
            </div>
        </div>
        <div class="setting-row">
            <div class="setting-label">Громкость SFX</div>
            <input type="range" min="0" max="100" value="70" id="sfxVolume">
        </div>
        <div class="setting-row">
            <div class="setting-label">Громкость музыки</div>
            <input type="range" min="0" max="100" value="50" id="musicVolume">
        </div>
        <button class="big-btn" onclick="closeModal('settingsModal')">Закрыть</button>
    </div>
</div>

<div class="modal" id="inventoryModal">
    <div class="modal-content">
        <div class="inv-tabs">
            <button class="inv-tab active" id="tabInv" onclick="switchInvTab('inv')">ИНВЕНТАРЬ</button>
            <button class="inv-tab" id="tabCol" onclick="switchInvTab('col')">КОЛЛЕКЦИЯ</button>
        </div>
        <div id="invView"></div>
        <div id="colView" style="display:none;">
            <div class="collection-header">
                <h2>Осенняя коллекция</h2>
                <div class="progress" id="collectionProgress">0/1</div>
            </div>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>
        <button class="big-btn" onclick="closeModal('inventoryModal')">Закрыть</button>
    </div>
</div>

<div class="modal" id="sellModal">
    <div class="modal-content">
        <div class="modal-title" id="sellCaption">Твоя цена рыночная</div>
        <div class="price-display" id="sellPrice">0 ₽</div>
        <div class="slider-wrap">
            <div class="slider-labels">
                <span class="green" id="minPriceLabel">50 ₽</span>
                <span class="red" id="maxPriceLabel">125 ₽</span>
            </div>
            <div class="slider-track"></div>
            <input type="range" class="slider-input" id="priceSlider" min="50" max="125" value="87">
        </div>
        <div class="price-caption" id="priceCaption">Твоя цена рыночная</div>
        <button class="big-btn" onclick="confirmSell()">Выставить на продажу</button>
    </div>
</div>

<script>
const ITEMS = [
    {
        id: 'pencil',
        name: 'Карандаш',
        image: 'https://cdn-icons-png.flaticon.com/512/1073/1073475.png',
        minPrice: 10,
        maxPrice: 250,
        marketPrice: 100,
        reward: 250,
        rarity: 'Обычный'
    }
];

const CHESTS = [
    {
        id: 'school',
        name: 'Школьный сундук',
        price: 100,
        drops: [{ itemId: 'pencil', chance: 100 }]
    }
];

let balance = 1000;
let inventory = [];
let mySales = [];
let collectedIndex = [];

function updateBalance() { document.getElementById('balanceValue').textContent = balance; }

function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('marketContent').style.display = tab === 'market' ? 'block' : 'none';
    document.getElementById('mySalesContent').style.display = tab === 'my-sales' ? 'block' : 'none';
    if (tab === 'my-sales') renderMySales();
}

function renderMySales() {
    const el = document.getElementById('mySalesContent');
    if (mySales.length === 0) {
        el.innerHTML = 'У вас пока нет продаж.';
        el.className = 'empty';
    } else {
        el.className = '';
        el.innerHTML = mySales.map((sale, i) => `
            <div style="background:#2b2b2b; border-radius:15px; padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div style="font-weight:bold;">${sale.name}</div>
                    <div style="color:#00aaff; margin-top:5px;">${sale.price} ₽</div>
                </div>
                <button onclick="removeSale(${i})" style="background:#ff1744; color:white; border:none; padding:8px 12px; border-radius:10px; cursor:pointer;">Убрать</button>
            </div>
        `).join('');
    }
}

function removeSale(index) { mySales.splice(index, 1); renderMySales(); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openInventory() {
    switchInvTab('inv');
    renderInventory();
    renderCollection();
    openModal('inventoryModal');
}

function switchInvTab(tab) {
    document.getElementById('tabInv').classList.remove('active');
    document.getElementById('tabCol').classList.remove('active');
    if (tab === 'inv') {
        document.getElementById('tabInv').classList.add('active');
        document.getElementById('invView').style.display = 'block';
        document.getElementById('colView').style.display = 'none';
    } else {
        document.getElementById('tabCol').classList.add('active');
        document.getElementById('invView').style.display = 'none';
        document.getElementById('colView').style.display = 'block';
    }
}

function renderInventory() {
    const view = document.getElementById('invView');
    if (inventory.length === 0) {
        view.innerHTML = '<div class="empty-inv">Инвентарь пуст. Открой сундук!</div>';
        return;
    }
    view.className = 'inv-grid';
    view.innerHTML = inventory.map((item, i) => `
        <div class="inv-card">
            <div class="badge">НОВЫЙ</div>
            <img src="${item.image}" alt="${item.name}">
            <div class="inv-name">${item.name}</div>
            <button class="btn-sell" onclick="openSell(${i})">НА ПРОДАЖУ</button>
            <button class="btn-fast" onclick="fastSell(${i})">БЫСТРАЯ ПРОДАЖА</button>
        </div>
    `).join('');
}

function openSell(index) {
    const item = inventory[index];
    const slider = document.getElementById('priceSlider');
    slider.min = item.minPrice;
    slider.max = item.maxPrice;
    slider.value = item.marketPrice;
    slider.dataset.index = index;
    document.getElementById('minPriceLabel').textContent = item.minPrice + ' ₽';
    document.getElementById('maxPriceLabel').textContent = item.maxPrice + ' ₽';
    updatePriceCaption();
    closeModal('inventoryModal');
    openModal('sellModal');
}

function fastSell(index) {
    const item = inventory[index];
    const price = Math.round((item.minPrice + item.maxPrice) / 2);
    balance += price;
    inventory.splice(index, 1);
    updateBalance();
    renderInventory();
    alert('Быстрая продажа: +' + price + ' ₽');
}

function updatePriceCaption() {
    const slider = document.getElementById('priceSlider');
    const item = inventory[slider.dataset.index];
    if (!item) return;
    const val = parseInt(slider.value);
    const caption = document.getElementById('sellCaption');
    const priceCaption = document.getElementById('priceCaption');
    document.getElementById('sellPrice').textContent = val + ' ₽';
    const range = item.maxPrice - item.minPrice;
    const pos = (val - item.minPrice) / range;
    if (pos < 0.35) {
        caption.textContent = 'Твоя цена ниже рынка';
        priceCaption.className = 'price-caption down';
        priceCaption.textContent = 'Твоя цена ниже рынка';
    } else if (pos > 0.65) {
        caption.textContent = 'Твоя цена выше рынка';
        priceCaption.className = 'price-caption up';
        priceCaption.textContent = 'Твоя цена выше рынка';
    } else {
        caption.textContent = 'Твоя цена рыночная';
        priceCaption.className = 'price-caption normal';
        priceCaption.textContent = 'Твоя цена рыночная';
    }
}

document.getElementById('priceSlider').addEventListener('input', updatePriceCaption);

function confirmSell() {
    const slider = document.getElementById('priceSlider');
    const index = parseInt(slider.dataset.index);
    const item = inventory[index];
    const price = parseInt(slider.value);
    mySales.push({ name: item.name, price: price });
    inventory.splice(index, 1);
    closeModal('sellModal');
    alert('Товар выставлен на продажу за ' + price + ' ₽');
}

function openChest() {
    const chest = CHESTS[0];
    if (balance < chest.price) {
        alert('Недостаточно средств! Нужно ' + chest.price + ' ₽');
        return;
    }
    if (!confirm('Открыть ' + chest.name + ' за ' + chest.price + ' ₽?')) return;

    balance -= chest.price;
    updateBalance();

    const roll = Math.random() * 100;
    let acc = 0;
    let dropped = null;
    for (const drop of chest.drops) {
        acc += drop.chance;
        if (roll < acc) {
            dropped = ITEMS.find(i => i.id === drop.itemId);
            break;
        }
    }

    if (dropped) {
        inventory.push({ ...dropped });
        alert('🎉 Выпал предмет: ' + dropped.name + '!');
    } else {
        alert('Пусто...');
    }
}

function openIndex() {
    switchInvTab('col');
    renderInventory();
    renderCollection();
    openModal('inventoryModal');
}

function renderCollection() {
    const grid = document.getElementById('collectionGrid');
    const collectedCount = ITEMS.filter(i => collectedIndex.includes(i.id)).length;
    document.getElementById('collectionProgress').textContent = collectedCount + '/' + ITEMS.length;

    grid.innerHTML = ITEMS.map(item => {
        const collected = collectedIndex.includes(item.id);
        return `
            <div class="collection-card ${collected ? 'collected' : ''}" onclick="tryClaim('${item.id}')">
                <div class="rarity">${item.rarity}</div>
                <div class="img-wrap">
                    <img src="${item.image}" alt="${item.name}">
                    ${!collected ? '<div class="not-collected">НЕ СОБРАН</div>' : ''}
                </div>
                <div class="bottom">${item.name}</div>
            </div>
        `;
    }).join('');
}

function tryClaim(itemId) {
    const item = ITEMS.find(i => i.id === itemId);
    if (!item) return;
    if (collectedIndex.includes(itemId)) {
        alert('Вы уже получили награду за ' + item.name);
        return;
    }
    if (!inventory.some(i => i.id === itemId)) {
        alert('Сначала получите ' + item.name + ' из сундука');
        return;
    }
    collectedIndex.push(itemId);
    balance += item.reward;
    updateBalance();
    renderCollection();
    alert('Вам начислено ' + item.reward + ' ₽!');
}

function setTheme(theme) {
    const body = document.body;
    document.getElementById('themeLight').classList.remove('active');
    document.getElementById('themeDark').classList.remove('active');
    if (theme === 'light') {
        body.classList.add('light');
        document.getElementById
